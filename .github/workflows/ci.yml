name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,smtp]"
      - name: Lint
        run: |
          ruff check notifications tests
          ruff format --check notifications tests
      - name: Test
        run: pytest --cov=notifications --cov-report=term-missing
      - name: Import check
        run: python -c "from notifications.main import app; import notifications.worker"

  postgres:
    name: test (PostgreSQL 16, concurrent workers)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notify
          POSTGRES_PASSWORD: notify
          POSTGRES_DB: notify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notify -d notify_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://notify:notify@localhost:5432/notify_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test claiming against PostgreSQL
        # The PostgreSQL tests skip without TEST_DATABASE_URL; fail here instead of passing empty.
        run: |
          pytest tests/test_postgres_claims.py -v -rs | tee pytest.out
          ! grep -q SKIPPED pytest.out

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: notification-service:ci
