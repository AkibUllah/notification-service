# Render blueprint: API with the in-process asyncio worker + managed PostgreSQL.
# Providers are the console/file stubs; unsubscribe links use RENDER_EXTERNAL_URL automatically.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: notification-service
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: WORKER_ENABLED
        value: "true"
      - key: EMAIL_PROVIDERS
        value: console
      - key: SMS_PROVIDERS
        value: console
      - key: PUSH_PROVIDERS
        value: file
      - key: PUSH_FILE_PATH
        value: /tmp/push-outbox.jsonl
      - key: DATABASE_URL
        fromDatabase:
          name: notification-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true

databases:
  - name: notification-db
    plan: free
    databaseName: notify
    user: notify
