[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notification-service"
version = "0.1.0"
description = "Multi-channel notification service: email, SMS, push, in-app and webhooks with templates, preferences, quiet hours, digests, retries and dead letters"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Akib Jafor" }]
requires-python = ">=3.10"
keywords = ["notifications", "email", "sms", "push", "in-app", "fastapi", "jinja2", "digest", "sse"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0,<3.0",
  "pydantic[email]>=2.5,<3.0",
  "pydantic-settings>=2.1",
  "httpx>=0.26",
  "jinja2>=3.1",
  "psycopg[binary]>=3.3.6",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
smtp = ["aiosmtplib>=3.0"]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "ruff>=0.3",
]

[project.scripts]
notifications-worker = "notifications.worker:main"

[tool.setuptools.packages.find]
include = ["notifications*"]

[tool.setuptools.package-data]
notifications = ["templates/*.html", "templates/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error::DeprecationWarning:notifications.*",
  "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["notifications"]
